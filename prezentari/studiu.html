<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Studiu PDF · Igienă</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:#e8eef7;color:#14233b}.toolbar{position:sticky;top:0;z-index:10;background:#07172f;color:white;padding:10px 16px;display:flex;gap:10px;align-items:center;justify-content:space-between}.toolbar .left{display:flex;gap:10px;align-items:center}.btn{border:0;border-radius:9px;padding:9px 12px;font-weight:800;cursor:pointer;text-decoration:none}.primary{background:#14b8a6;color:#06221f}.soft{background:#fff;color:#1e3a5f}.hint{font-size:12px;color:#b8c7d9}.deck{max-width:1280px;margin:24px auto;padding:0 16px}.page{width:100%;aspect-ratio:16/9;background:#fff;margin:0 auto 24px;padding:4.2% 5%;box-shadow:0 14px 40px rgba(15,23,42,.15);position:relative;overflow:hidden;border-radius:8px}.no{font-size:11px;color:#0f766e;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.page h1{font-size:clamp(24px,3.4vw,46px);line-height:1.06;color:#0b2444;margin:12px 0 18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.block{font-size:clamp(11px,1.25vw,17px);line-height:1.35;padding:10px 12px;border:1px solid #e2e8f0;border-radius:10px;background:#f8fafc;white-space:pre-line}.source{border-left:4px solid #14b8a6;color:#475569;font-size:clamp(9px,1vw,13px)}.page footer{position:absolute;left:5%;right:5%;bottom:3%;display:flex;justify-content:space-between;font-size:9px;color:#94a3b8}@media(max-width:700px){.grid{grid-template-columns:1fr}.page{aspect-ratio:auto;min-height:70vh}.toolbar{align-items:flex-start;flex-direction:column}.hint{display:none}}@page{size:A4 landscape;margin:8mm}@media print{body{background:white}.toolbar{display:none}.deck{max-width:none;margin:0;padding:0}.page{width:100%;height:190mm;aspect-ratio:auto;margin:0;box-shadow:none;border-radius:0;break-after:page;page-break-after:always}.page:last-child{break-after:auto}.page h1{font-size:24pt}.block{font-size:10.5pt}.source{font-size:8.5pt}}</style></head><body><div class="toolbar"><div class="left"><a class="btn soft" href="javascript:history.back()">← Înapoi</a><strong id="title">Studiu</strong></div><div><span class="hint">În fereastra de imprimare alege „Save as PDF / Salvare ca PDF”.</span> <button class="btn primary" onclick="window.print()">⬇ Salvează PDF</button></div></div><main id="deck" class="deck"><p>Se încarcă…</p></main><script src="studiu.js"></script></body></html>
