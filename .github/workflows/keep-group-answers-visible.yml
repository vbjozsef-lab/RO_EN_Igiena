name: Keep group answers visible
on:
  push:
    paths:
      - '.github/trigger-keep-group-answers'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/keep_group_answers_visible.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 6lucrari/index.html
          git commit -m "Keep submitted group answers visible and locked"
          git push
