name: Student registry patch
on:
  push:
    paths:
      - '.github/trigger-students'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/extract_students.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/student-snippets.txt
          git commit -m "Inspect student registry structure"
          git push
