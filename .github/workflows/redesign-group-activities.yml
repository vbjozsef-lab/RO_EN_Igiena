name: Redesign group activities
on:
  push:
    paths:
      - '.github/trigger-redesign-group'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/redesign_group_activity.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 6lucrari/index.html 6lucrari/team-mission-ui.jsx
          git commit -m "Redesign six-LP group activities for mobile structured answers"
          git push
