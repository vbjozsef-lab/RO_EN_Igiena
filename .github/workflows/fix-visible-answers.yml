name: Fix submitted answers visibility
on:
  push:
    paths:
      - '.github/trigger-fix-visible-answers'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/fix_visible_submitted_answers.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 6lucrari/index.html
          git commit -m "Keep own submitted group answers visible after sync"
          git push
