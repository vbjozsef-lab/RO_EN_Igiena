name: Merge individual quizzes into six LPs
on:
  push:
    paths:
      - '.github/trigger-merge-quizzes'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run quiz merge patch
        run: |
          set +e
          python .github/scripts/merge_individual_quizzes.py > .github/quiz-patch-log.txt 2>&1
          STATUS=$?
          cat .github/quiz-patch-log.txt
          echo "PATCH_STATUS=$STATUS" >> .github/quiz-patch-log.txt
      - name: Commit result or diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html 6lucrari/index.html .github/quiz-patch-log.txt
          git commit -m "Apply six-LP quiz merge or save diagnostic"
          git push
