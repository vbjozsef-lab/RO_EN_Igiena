name: Merge individual quizzes into six LPs
on:
  push:
    paths:
      - '.github/trigger-merge-quizzes'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/merge_individual_quizzes.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html 6lucrari/index.html
          git commit -m "Align individual quizzes with six merged LPs"
          git push
