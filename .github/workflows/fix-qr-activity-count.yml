name: Fix QR activity count
on:
  push:
    paths:
      - '.github/trigger-fix-qr-count'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/fix_qr_activity_count.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 6lucrari/index.html
          git commit -m "Allow QR generation with five group activities"
          git push
