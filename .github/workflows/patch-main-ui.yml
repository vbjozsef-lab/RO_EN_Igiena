name: Patch main presentation UI

on:
  push:
    paths:
      - '.github/trigger-main-ui'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Inspect student registry
        run: python .github/scripts/extract_students.py
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/student-snippets.txt
          git commit -m "Inspect student registry structure"
          git push
