name: Patch main presentation UI

on:
  push:
    paths:
      - '.github/trigger-main-ui'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch index.html
        run: python .github/scripts/patch_main_ui.py
      - name: Commit main app update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No index.html changes to commit."
            exit 0
          fi
          git commit -m "Separate laboratory and teaching presentations"
          git push
