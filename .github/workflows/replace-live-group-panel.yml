name: Replace live group panel
on:
  push:
    paths:
      - '.github/trigger-replace-live-group-panel'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/replace_live_group_panel.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 6lucrari/index.html
          git commit -m "Replace legacy group rooms with five-case progress"
          git push
