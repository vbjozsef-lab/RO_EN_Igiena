name: Use final approved group cases
on:
  push:
    paths:
      - '.github/trigger-final-group-cases'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/use_final_group_cases.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 6lucrari/index.html
          git commit -m "Use final approved 30 group cases"
          git push
