function sb(path,opt={}){return fetch(SB+"/rest/v1/"+path,{...opt,headers:{"Content-Type":"application/json","apikey":KEY,"Authorization":"Bearer "+KEY,"Prefer":opt.prefer||"return=minimal",...(opt.headers||{})}})}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function prepare(bank){return shuffle(bank.map((x,qi)=>{const pairs=x.o.map((text,i)=>({text,orig:i}));const sp=shuffle(pairs);return{...x,origIndex:qi,o:sp.map(p=>p.text),c:sp.map((p,i)=>x.c.includes(p.orig)?i:null).filter(i=>i!==null)}}))}
function grade(pct){return Number((pct/10).toFixed(1))}
function baseUrl(){return location.href.split("?")[0].split("#")[0]}
function token(type){return "KF26-"+(type==="practical"?"P":"T")+"-"+Math.random().toString(36).slice(2,8).toUpperCase()+Date.now().toString(36).toUpperCase()}

async function saveResultReliable(entry){for(let i=0;i<5;i++){const r=await saveResultOnce(entry);if(r.ok)return r;await new Promise(res=>setTimeout(res,700*(i+1)))}return{ok:false,error:"A szerver nem igazolta vissza a mentést."}}

async function generateQR(type){
 const dur=Math.max(5,Number(q("#dur-"+type).value)||20), t=token(type), labCode="KURZUSFOGASZAT2026-"+(type==="practical"?"PRACTICAL":"THEORY")+"-EXAM";

 const ok=await addSession(s); if(!ok){q("#qr-"+type).innerHTML='<div class="bad">A QR-session mentése sikertelen.</div>';return}
 const url=baseUrl()+"?token="+encodeURIComponent(t);
 const box=q("#qr-"+type);box.innerHTML='<div class="ok"><b>'+(type==="practical"?"Gyakorlati":"Elméleti")+' QR</b><div class="muted">Érvényes: '+dur+' perc</div></div><div class="qr" id="qrcode-'+type+'"></div><div class="muted center">Token: '+esc(t)+'</div>';

}

 box.innerHTML='<div style="overflow:auto"><table><thead><tr><th>Vizsga</th><th>Nr. matricol</th><th>Név</th><th>Jegy</th><th>Scor</th><th>%</th><th>Idő</th><th>Dátum</th></tr></thead><tbody>'+rows.map(r=>{let m={};try{m=JSON.parse(r.answers_text||"{}")}catch(e){};return'<tr><td>'+(String(r.lab_code).includes("PRACTICAL")?"Gyakorlati":"Elméleti")+'</td><td>'+esc(m.matricol||"")+'</td><td>'+esc(r.name||"")+'</td><td><b>'+esc(m.grade??grade(r.pct))+'</b></td><td>'+esc(r.score)+"/"+esc(r.total)+'</td><td>'+esc(r.pct)+'%</td><td>'+esc(r.time_used)+'s</td><td>'+new Date(r.created_at).toLocaleString("hu-HU")+'</td></tr>'}).join("")+'</tbody></table></div>';
}
function exportCSV(){const rows=window._kfrows||[];const H=["Vizsga","Nr. matricol","Név","Jegy","Scor","Procent","Timp sec","Profesor","Dátum"];const out=[H.join(";")];for(const r of rows){let m={};try{m=JSON.parse(r.answers_text||"{}")}catch(e){};out.push([String(r.lab_code).includes("PRACTICAL")?"Gyakorlati":"Elméleti",m.matricol||"",r.name||"",m.grade??grade(r.pct),(r.score||0)+"/"+(r.total||0),(r.pct||0)+"%",r.time_used||0,r.teacher||"",new Date(r.created_at).toLocaleString("hu-HU")].map(x=>'"'+String(x).replaceAll('"','""')+'"').join(";"))}const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+out.join("\n")],{type:"text/csv;charset=utf-8"}));a.download="kurzusfogaszat2026_eredmenyek.csv";a.click()}
async function studentEntry(tokenValue){
 APP.innerHTML='<div class="card center"><h2>Vizsga ellenőrzése…</h2></div>';const s=await getSession(tokenValue);
 if(!s){APP.innerHTML='<div class="card bad">A QR-kód érvénytelen vagy lejárt.</div>';return}
 state.session=s;state.exam=String(s.lab_code).includes("PRACTICAL")?"practical":"theory";
 APP.innerHTML='<div class="card" style="max-width:480px;margin:auto"><h2>'+(state.exam==="practical"?"🧪 Gyakorlati vizsga":"📘 Elméleti vizsga")+'</h2><p class="muted">Adja meg a matricolszámát.</p><input id="mat" class="inp" inputmode="numeric" placeholder="Nr. matricol"><button class="btn" id="enter">Tovább</button><div id="serr"></div></div>';
 q("#enter").onclick=()=>{const m=q("#mat").value.trim();const st=STUDENTS.find(x=>x.matricol===m);if(!st){q("#serr").innerHTML='<div class="bad">A matricolszám nincs a névsorban.</div>';return}state.student=st;confirmStart()}
}
function confirmStart(){APP.innerHTML='<div class="card" style="max-width:560px;margin:auto"><h2>'+esc(state.student.name)+'</h2><div class="tag">Nr. matricol: '+esc(state.student.matricol)+'</div><p><b>'+(state.exam==="practical"?"Gyakorlati vizsga · 10 kérdés":"Elméleti vizsga · 20 kérdés")+'</b></p><div class="warn">A kérdések és a válaszlehetőségek sorrendje egyénileg kevert. A végén az eredmény csak sikeres szervermentés után jelenik meg.</div><button class="btn" id="start" style="margin-top:14px">Vizsga indítása</button></div>';q("#start").onclick=startExam}
function startExam(){state.qs=prepare(state.exam==="practical"?PRACTICAL:THEORY);state.answers={};state.started=Date.now();state.unsaved=true;window.onbeforeunload=()=>state.unsaved?"A vizsga még nincs mentve.":undefined;try{document.documentElement.requestFullscreen?.()}catch(e){};renderExam(0)}
function renderExam(i){const item=state.qs[i], multi=item.c.length>1, selected=state.answers[i]||[];APP.innerHTML='<div class="card"><div style="display:flex;justify-content:space-between"><b>'+(state.exam==="practical"?"Gyakorlati":"Elméleti")+'</b><span>'+ (i+1)+'/'+state.qs.length+'</span></div><div class="progress" style="margin-top:10px"><div style="width:'+Math.round(i/state.qs.length*100)+'%"></div></div></div><div class="q"><h3>'+esc(item.q)+'</h3><div class="muted">'+(multi?"Több helyes válasz is lehet.":"Egy helyes válasz.")+'</div>'+item.o.map((o,oi)=>'<button class="opt '+(selected.includes(oi)?"sel":"")+'" data-o="'+oi+'"><b>'+String.fromCharCode(65+oi)+'.</b> '+esc(o)+'</button>').join("")+'</div><div style="display:flex;gap:10px;justify-content:space-between">'+(i?'<button class="btn light" id="prev">← Előző</button>':'<span></span>')+'<button class="btn" id="next">'+(i===state.qs.length-1?"Befejezés":"Következő →")+'</button></div>';
 qa("[data-o]").forEach(b=>b.onclick=()=>{const oi=Number(b.dataset.o);let a=state.answers[i]||[];if(multi){a=a.includes(oi)?a.filter(x=>x!==oi):[...a,oi]}else a=[oi];state.answers[i]=a;renderExam(i)});
 if(i)q("#prev").onclick=()=>renderExam(i-1);
 q("#next").onclick=()=>{if(!(state.answers[i]||[]).length){alert("Válasszon legalább egy választ.");return}if(i===state.qs.length-1){if(Object.keys(state.answers).length!==state.qs.length){alert("Minden kérdésre válaszolni kell.");return}finishExam()}else renderExam(i+1)}
}
async function finishExam(){
 APP.innerHTML='<div class="card center"><h2>💾 Eredmény mentése…</h2><p class="muted">Ne zárja be az oldalt.</p></div>';
 const audit=state.qs.map((x,i)=>{const s=[...(state.answers[i]||[])].sort((a,b)=>a-b),c=[...x.c].sort((a,b)=>a-b);return{nr:i+1,question:x.q,options:x.o,selected:s,correct:c,isCorrect:JSON.stringify(s)===JSON.stringify(c)}});
 const score=audit.filter(x=>x.isCorrect).length,total=state.qs.length,pct=Math.round(score/total*100),g=grade(pct),timeUsed=Math.round((Date.now()-state.started)/1000);
 const meta={type:"kurzusfogaszat2026_exam_v1",examType:state.exam,matricol:state.student.matricol,name:state.student.name,grade:g,answers:audit,session:state.session.id};
 const entry={session_id:state.session.id,name:state.student.name,grp:"",lab_id:"kurzusfogaszat2026",lab_code:state.session.lab_code,module:"kf26_"+state.exam+"_exam",module_title:state.exam==="practical"?"Kurzusfogászat 2026 — Gyakorlati vizsga":"Kurzusfogászat 2026 — Elméleti vizsga",score,total,pct,time_used:timeUsed,teacher:state.session.teacher||"",semester:"2026",specialization:"Medicină dentară – Limba maghiară",study_year:"Anul I",answers_text:JSON.stringify(meta)};
 const saved=await saveResultReliable(entry);
 if(!saved.ok){localStorage.setItem("kf26_pending_result",JSON.stringify(entry));APP.innerHTML='<div class="card bad center"><h2>⚠️ AZ EREDMÉNY NINCS ELMENTVE</h2><p>Ne zárja be ezt az oldalt. A szerver nem igazolta vissza a mentést.</p><button class="btn red" id="retry">Mentés újrapróbálása</button></div>';q("#retry").onclick=()=>finishExam();return}
 localStorage.removeItem("kf26_pending_result");state.unsaved=false;window.onbeforeunload=null;
 APP.innerHTML='<div class="card center" style="max-width:620px;margin:auto"><div class="muted">'+(state.exam==="practical"?"GYAKORLATI VIZSGA":"ELMÉLETI VIZSGA")+'</div><h2>'+esc(state.student.name)+'</h2><div class="tag">Nr. matricol '+esc(state.student.matricol)+'</div><div class="big" style="margin-top:20px">'+g+'</div><div>/10</div><div class="ok" style="margin-top:18px">✓ Az eredmény sikeresen elmentve a tanári rendszerbe.</div><div class="grid" style="margin-top:16px"><div class="card"><b>'+score+'/'+total+'</b><div class="muted">helyes</div></div><div class="card"><b>'+pct+'%</b><div class="muted">eredmény</div></div></div><p class="muted">A helyes válaszokat a rendszer nem jeleníti meg a hallgatónak.</p></div>'
}
const params=new URLSearchParams(location.search);const tok=params.get("token");if(tok)studentEntry(tok);else home();
</script></body></html>
